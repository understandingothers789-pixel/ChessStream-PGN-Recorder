name: Windows validation and portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PACKAGE_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/fix/non-destructive-pgn-gap-joins' || github.ref == 'refs/heads/dev') && github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e . pytest
      - run: python scripts/check_runtime.py
      - run: python -m pytest -q
      - name: Build portable ZIP
        if: env.PACKAGE_WINDOWS == 'true'
        run: python scripts/build_windows.py
      - name: Test packaged inference imports
        if: env.PACKAGE_WINDOWS == 'true'
        run: |
          python -c "import json, os, pathlib, tomllib; manifest=json.loads(pathlib.Path('build/windows-portable/BUILD-MANIFEST.json').read_text()); expected=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert manifest['application_version']==expected; assert manifest['source_revision']==os.environ['GITHUB_SHA']; print('Portable build identity passed')"
          build/windows-portable/runtime/python.exe -c "import chess, cv2, numpy, mss, psutil, onnxruntime, pyaudiowpatch; from PySide6.QtWidgets import QApplication; from chessstream.vision import ScreenshotRecognizer; r=ScreenshotRecognizer(); o=r.recognize(cv2.imread('tests/fixtures/real/chesscom-ruy-000.png')); assert o.placement()==chess.Board().board_fen(); print('Bundled neural inference passed')"
          build/windows-portable/runtime/python.exe -c "import cv2; from chessstream.results import LocalTextReader,parse_end_message; lines=LocalTextReader().read(cv2.imread('tests/fixtures/results/native-bot-resigned.png')); message=parse_end_message(lines,'white',{'black':'Martinfoot'}); assert message and message.result=='0-1'; print('Bundled offline text recognition passed')"
      - name: Test the command launcher
        if: env.PACKAGE_WINDOWS == 'true'
        run: |
          $smokeDir = Join-Path $env:GITHUB_WORKSPACE "build/launcher-smoke"
          $smokeImage = Join-Path $env:GITHUB_WORKSPACE "build/launcher-desktop.png"
          & "build/windows-portable/Launch ChessStream.cmd" --data-dir "$smokeDir" --smoke "$smokeImage"
          $deadline = (Get-Date).AddSeconds(30)
          while (!(Test-Path "build/launcher-desktop.png") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (!(Test-Path "build/launcher-desktop.png")) { throw "Portable command launcher failed to render the desktop" }
      - name: Test desktop shortcut branding
        if: env.PACKAGE_WINDOWS == 'true'
        run: |
          build/windows-portable/runtime/python.exe -c "from pathlib import Path; from chessstream.desktop import create_desktop_shortcut; p=create_desktop_shortcut(Path('build/shortcut-smoke'),force=True); assert p and p.is_file(); print('Desktop shortcut created')"
          $stamp = Get-Content 'build/shortcut-smoke/desktop-shortcut.json' | ConvertFrom-Json
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($stamp.shortcut)
          if (!($shortcut.TargetPath.EndsWith('pythonw.exe'))) { throw 'Shortcut target is not the GUI launcher' }
          if (!($shortcut.Arguments.Contains('-m chessstream'))) { throw 'Shortcut arguments are missing' }
          if (!($shortcut.IconLocation.EndsWith('.ico,0'))) { throw 'Shortcut does not use ChessStream artwork' }
          $icon = $shortcut.IconLocation -replace ',0$', ''
          if (!(Test-Path $icon)) { throw 'Shortcut artwork is missing' }
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE_WINDOWS == 'true'
        with:
          name: ChessStream
          path: dist/ChessStream.zip
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE_WINDOWS == 'true'
        with:
          name: Windows-smoke-images
          path: build/*desktop.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ChessStream
          path: release-assets
      - name: Publish validated portable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/ChessStream.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "ChessStream PGN Recorder $GITHUB_REF_NAME" --notes-file "docs/RELEASE-$GITHUB_REF_NAME.md"
